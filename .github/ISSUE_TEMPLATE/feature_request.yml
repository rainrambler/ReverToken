name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels:
  - enhancement
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ReverToken. Please describe the use case
        before proposing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is missing today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the CLI, output, or format changes you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools or workarounds you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI / UX
        - PE parsing
        - ELF parsing
        - Mach-O parsing
        - Demangling
        - Search / filtering
        - Output / JSON
        - Documentation
        - Other

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
