[package]
name = "rever-token"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform export-table scanner for PE, ELF, and Mach-O binaries"
authors = ["ReverToken contributors"]
license = "MIT"
readme = "README.md"
keywords = ["pe", "elf", "macho", "reverse-engineering", "symbols"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "revertoken"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cpp_demangle = "0.5"
goblin = "0.10"
msvc-demangler = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
lto = "thin"
strip = true
